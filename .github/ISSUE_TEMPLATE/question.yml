name: "❓ Support / Question"
description: Ask for help getting BambuDeck-HA flashed, configured, or connected to Home Assistant
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for asking! Please check the [README](https://github.com/demonkazuya/BambuDeck-HA#readme) first — especially the setup steps for your Home Assistant Long-Lived Access Token and printer entity prefix. Many common setup questions are answered there.

  - type: textarea
    id: what_trying_to_do
    attributes:
      label: What are you trying to do?
      description: Describe what you are configuring or trying to achieve.
      placeholder: "e.g., I want to connect my ESP32-2432S028R to my Home Assistant instance and display my P1S status..."
    validations:
      required: true

  - type: textarea
    id: what_tried
    attributes:
      label: What have you tried so far?
      description: Steps you've already taken, and what happened.
      placeholder: "e.g., Flashed the binary, connected to Wi-Fi portal, entered token and printer entity, but screen shows disconnected..."
    validations:
      required: false

  - type: dropdown
    id: device_model
    attributes:
      label: CYD / ESP32 Hardware Model
      options:
        - "ESP32-2432S028R (2.8\" Resistive Touch - Standard CYD)"
        - "ESP32-2432S028C (2.8\" Capacitive Touch)"
        - "ESP32-3248S035 (3.5\" Display)"
        - "ESP32-2432S024 (2.4\" Display)"
        - "Other / Custom Hardware"
    validations:
      required: false

  - type: input
    id: firmware_version
    attributes:
      label: Firmware Version
      placeholder: "e.g., v0.2.2"
    validations:
      required: false

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant Version
      placeholder: "e.g., 2026.10.2"
    validations:
      required: false
